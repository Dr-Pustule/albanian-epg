name: Update TV guide

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download the guide grabber
        run: git clone --depth 1 -b master https://github.com/iptv-org/epg.git grabber

      - name: Install grabber
        working-directory: grabber
        run: npm install

      - name: Grab Kosovo + Albania listings
        working-directory: grabber
        run: |
          npm run grab --- --sites=ipko.tv,tvim.tv --days=3 --maxConnections=5 \
            --output=../out/guide.xml --gzip=../out/guide.xml.gz

      - name: Check the guide is not empty
        run: |
          n=$(grep -c '<programme' out/guide.xml || true)
          echo "Programmes: $n"
          test "$n" -gt 100

      - name: Publish to the guide branch
        working-directory: out
        run: |
          git init -q -b guide
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml guide.xml.gz
          git commit -q -m "Guide update $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" guide
